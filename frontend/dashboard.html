<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLink Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="logo" href="/dashboard.html"><span class="logo-mark">✚</span> LifeLink</a>
      <span class="badge info" id="role-badge"></span>
      <span class="spacer"></span>
      <span class="small muted" id="who"></span>
      <button class="btn sm bell" id="bell" aria-label="Notifications">🔔<span class="count hidden" id="bell-count"></span></button>
      <button class="btn sm" id="logout">Log out</button>
    </div>
  </header>
  <div class="notif-panel hidden" id="notif-panel" role="dialog" aria-label="Notifications"></div>

  <main class="container">
    <div id="verify-banner"></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <section id="view"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
